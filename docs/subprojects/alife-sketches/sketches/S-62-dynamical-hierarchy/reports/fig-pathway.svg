<text x="10" y="22" font-size="15" font-weight="700">ミセルは「鎖の集まり」として組み上がったか、「塊の中で鎖ができた」か（F=[0,20000)）</text><text x="10" y="40" font-size="11" class="t2">点は登録の値（実装の出力）。細い線は、参加と最初の結合が同じスナップショットの区間に入った T（曖昧）を</text><text x="10" y="55" font-size="11" class="t2">除いた値から、曖昧な T を全部「逆側」に数えた値までの幅（S4 の再計算）</text><rect x="288" y="278" width="132" height="132" fill="var(--band)"/><text x="294.6" y="292" font-size="11" class="t2">組み立て</text><rect x="90" y="80" width="99" height="132" fill="var(--band2)"/><text x="182.4" y="206" font-size="11" text-anchor="end" class="t2">その場</text><line x1="90" y1="410" x2="90" y2="80" stroke="var(--grid)"/><line x1="90" y1="410" x2="420" y2="410" stroke="var(--grid)"/><text x="90" y="424" font-size="10" text-anchor="middle" class="mu">0</text><text x="84" y="414" font-size="10" text-anchor="end" class="mu">0</text><line x1="156" y1="410" x2="156" y2="80" stroke="var(--grid)"/><line x1="90" y1="344" x2="420" y2="344" stroke="var(--grid)"/><text x="156" y="424" font-size="10" text-anchor="middle" class="mu">0.2</text><text x="84" y="348" font-size="10" text-anchor="end" class="mu">0.2</text><line x1="222" y1="410" x2="222" y2="80" stroke="var(--grid)"/><line x1="90" y1="278" x2="420" y2="278" stroke="var(--grid)"/><text x="222" y="424" font-size="10" text-anchor="middle" class="mu">0.4</text><text x="84" y="282" font-size="10" text-anchor="end" class="mu">0.4</text><line x1="288" y1="410" x2="288" y2="80" stroke="var(--grid)"/><line x1="90" y1="212" x2="420" y2="212" stroke="var(--grid)"/><text x="288" y="424" font-size="10" text-anchor="middle" class="mu">0.6</text><text x="84" y="216" font-size="10" text-anchor="end" class="mu">0.6</text><line x1="354" y1="410" x2="354" y2="80" stroke="var(--grid)"/><line x1="90" y1="146" x2="420" y2="146" stroke="var(--grid)"/><text x="354" y="424" font-size="10" text-anchor="middle" class="mu">0.8</text><text x="84" y="150" font-size="10" text-anchor="end" class="mu">0.8</text><line x1="420" y1="410" x2="420" 