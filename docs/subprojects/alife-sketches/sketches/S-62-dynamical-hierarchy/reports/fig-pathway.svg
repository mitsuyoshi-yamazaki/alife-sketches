<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" role="img" aria-labelledby="t d">
<title id="t">S-62 形成の経路（φ_pre と β_in）</title><desc id="d">横軸 φ_pre（U2 へ参加した T のうち鎖として到着した割合）、縦軸 β_in（最初の結合が U2 の中で起きた割合）。登録の領域「組み立て」「その場」を塗る。</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
