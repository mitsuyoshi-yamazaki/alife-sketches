 stroke="var(--s3)" stroke-width="2"/><circle cx="80.0" cy="283.9" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 6–8: 0.06</title></circle><circle cx="145.0" cy="252.4" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 9–13: 0.22</title></circle><circle cx="210.0" cy="261.2" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 14–19: 0.17</title></circle><circle cx="275.0" cy="232.4" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 20–29: 0.32</title></circle><circle cx="340.0" cy="250.2" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 30+: 0.23</title></circle><polyline points="80.0,294.9 145.0,291.7 210.0,288.4 275.0,279.5 340.0,125.5" fill="none" stroke="var(--gray)" stroke-width="2"/><circle cx="80.0" cy="294.9" r="4" fill="var(--gray)" stroke="var(--surface)" stroke-width="1.5"><title>NC-nobond 6–8: 0.01</title></circle><circle cx="145.0" cy="291.7" r="4" fill="var(--gray)" stroke="var(--surface)" stroke-width="1.5"><title>NC-nobond 9–13: 0.02</title></circle><circle cx="210.0" cy="288.4" r="4" fill="var(--gray)" stroke="var(--surface)" stroke-width="1.5"><title>NC-nobond 14–19: 0.04</title></circle><circle cx="275.0" cy="279.5" r="4" fill="var(--gray)" stroke="var(--surface)" stroke-width="1.5"><title>NC-nobond 20–29: 0.08</title></circle><circle cx="340.0" cy="125.5" r="4" fill="var(--gray)" stroke="var(--surface)" stroke-width="1.5"><title>NC-nobond 30+: 0.85</title></circle><text x="450" y="86" font-size="12" font-weight="600">P_io を満たした単位の割合</text><line x1="450" y1="296" x2="750" y2="296" stroke="var(--grid)"/><text x="444" y="300" font-size="10" text-anchor="end" class="mu">0.0</text><line x1="450" y1="246" x2="750" y2="246" stroke="var(--grid)"/><text x="444" y="250" font-size="10" text-anchor="end" class="mu">0.25</text><line x1="450" y1="196" x2="750" y2="196" stroke="var(--grid)"/><text x="444" y="200" font-size="10" text-anchor="end" class="mu">0.5</text><line x1="450" y1="146" x2="750" y2="146" stroke="var(--grid)"/><text x="444" y="150" font-size="10" text-anchor="end" class="mu">0.75</text><line x1="450" y1="96" x2="750" y2="96" stroke="var(--grid)"/><text x="444" y="100" font-size="10" text-anchor="end" class="mu">1.0</text><text x="470" y="310" font-size="10" text-anchor="middle" class="mu">6–8</text><text x="535" y="310" font-size="10" text-anchor="middle" class="mu">9–13</text><text x="600" y="310" font-size="10" text-anchor="middle" class="mu">14–19</text><text x="665" y="310" font-size="10" text-anchor="middle" class="mu">20–29</text><text x="730" y="310" font-size="10" text-anchor="middle" class="mu">30+</text><text x="600" y="326" font-size="10" text-anchor="middle" class="mu">U2 の T の数</text><polyline points="470.0,295.7 535.0,261.3 600.0,206.4 665.0,206.9 730.0,253.5" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="470.0" cy="295.7" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="1.5"><title>M-F25 6–8: 0.00</title></circle><circle cx="535.0" cy="261.3" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="1.5"><title>M-F25 9–13: 0.17</title></circle><circle cx="600.0" cy="206.4" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="1.5"><title>M-F25 14–19: 0.45</title></circle><circle cx="665.0" cy="206.9" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="1.5"><title>M-F25 20–29: 0.45</title></circle><circle cx="730.0" cy="253.5" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="1.5"><title>M-F25 30+: 0.21</title></circle><polyline points="470.0,296.0 535.0,244.0 600.0,156.5 665.0,203.2 730.0,248.8" fill="none" stroke="var(--s2)" stroke-width="2"/><circle cx="470.0" cy="296.0" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="1.5"><title>R-pre 6–8: 0.00</title></circle><circle cx="535.0" cy="244.0" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="1.5"><title>R-pre 9–13: 0.26</title></circle><circle cx="600.0" cy="156.5" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="1.5"><title>R-pre 14–19: 0.70</title></circle><circle cx="665.0" cy="203.2" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="1.5"><title>R-pre 20–29: 0.46</title></circle><circle cx="730.0" cy="248.8" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="1.5"><title>R-pre 30+: 0.24</title></circle><polyline points="470.0,295.7 535.0,255.2 600.0,176.3 665.0,142.9 730.0,157.4" fill="none" stroke="var(--s3)" stroke-width="2"/><circle cx="470.0" cy="295.7" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 6–8: 0.00</title></circle><circle cx="535.0" cy="255.2" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 9–13: 0.20</title></circle><circle cx="600.0" cy="176.3" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 14–19: 0.60</title></circle><circle cx="665.0" cy="142.9" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 20–29: 0.77</title></circle><circle cx="730.0" cy="157.4" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"><title>PC-insitu 30+: 0.69</title></circle><text x="10" y="350" font-size="11" class="t2">小さな U2（T 6〜8）は全部の T が縁にあって b=0。大きな U2（30+）は頭が外に出きらず ρ_io&lt;1.3 になりやすい。</text><text x="10" y="366" font-size="11" class="t2">P_io を満たしたのは中くらいの U2 だった。PC-insitu は大きな U2 が多く、そこで P_io を満たした。</text></svg>
