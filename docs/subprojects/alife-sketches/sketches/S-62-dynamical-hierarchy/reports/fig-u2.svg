<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 376" width="780" height="376" role="img" aria-labelledby="t d">
<title id="t">S-62 U2 の大きさと内と外の分離</title><desc id="d">左: U2 の大きさ（T の数）の区間ごとの単位の割合。右: 区間ごとに P_io を満たした単位の割合。2 seeds を合算。</desc>
