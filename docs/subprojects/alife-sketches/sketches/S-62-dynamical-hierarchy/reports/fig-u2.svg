<rect x="0" y="0" width="780" height="376" fill="var(--surface)"/>
<text x="10" y="22" font-size="15" font-weight="700">U2（ミセル）の大きさと、内と外の分離（W・2 seeds を合算）</text><line x1="12" y1="44" x2="30" y2="44" stroke="var(--s1)" stroke-width="2"/><circle cx="21" cy="44" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="1.5"/><text x="36" y="48" font-size="11" class="t2">M-F25（単量体から・速い結合）</text><line x1="382" y1="44" x2="400" y2="44" stroke="var(--s2)" stroke-width="2"/><circle cx="391" cy="44" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="1.5"/><text x="406" y="48" font-size="11" class="t2">R-pre（既製の四量体から）</text><line x1="12" y1="60" x2="30" y2="60" stroke="var(--s3)" stroke-width="2"/><circle cx="21" cy="60" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="1.5"/><text x="36" y="64" font-size="11" class="t2">PC-insitu（油滴を先に作る）</text><line x1="382" y1="60" x2="400" y2="60" stroke="var(--gray)" stroke-width="2"/><circle cx="391" cy="60" r="4" fill="var(--gray)" stroke="var(--surface)" stroke-width="1.5"/><text x="406" y="64" font-size="11" class="t2">NC-nobond（結合なし・油滴）</text><text x="60" y="86" font-size="12" font-weight="600">単位の割合（大きさの区間ごと）</text><line x1="60" y1="296" x2="360" y2="296" stroke="var(--grid)"/><text x="54" y="300" font-size="10" text-anchor="end" class="mu">0.0</text><line x1="60" y1="246" x2="360" y2="246" stroke="var(--grid)"/><text x="54" y="250" font-size="10" text-anchor="end" class="mu">0.25</text><line x1="60" y1="196" x2="360" y2="196" stroke="var(--grid)"/><text x="54" y="200" font-size="10" text-anchor="end" class="mu">0.5</text><line x1="60" y1="146" x2="360" y2="146" stroke="var(--grid)"/><text x="54" y="150" font-size="10" text-anchor="end" class="mu">0.75</text><line x1="60" y1="96" x2="360" y2="96" stroke="var(--grid)"/><text x="54" y="100" font-size="10" text-anchor="end" class="mu">1.0</text><text x="80" y="310" font-size="10" text-anchor="middle" class="mu">6–8</text><text x="145" y="310" font-size="10" text-anchor="middle" class="mu">9–13</text><text x="210" y="310" font-