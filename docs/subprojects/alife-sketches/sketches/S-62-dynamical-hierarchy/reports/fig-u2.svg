  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --gray:#898781; --band:#eef3fb; --band2:#fdf0ea; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --gray:#898781; --band:#1d2633; --band2:#2e211b; }
  }
  text { font-family: system-ui, -apple-system, "Hiragino Sans", "Segoe UI", sans-serif; fill: var(--ink); }
  .t2 { fill: var(--ink2); } .mu { fill: var(--muted); }
