"436" class="m">単一種では ⑧ は、1 チャネルでは D-chan も定義されない（M-rand2 は D-chan を持つが生き物が 0）</text><text x="16" y="452" class="m">③は単一種で D-iso＋IAAFT の超過、多種で D-param（登録）。多種の D-param の輪は最長 6 観測で、200 歩（20 観測）に届いた走行は無い</text></svg>