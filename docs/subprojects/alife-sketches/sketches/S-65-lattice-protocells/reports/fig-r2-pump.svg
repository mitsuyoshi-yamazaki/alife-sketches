.s .f1{fill:var(--c1)}.s .f2{fill:var(--c2)}.s .f3{fill:var(--c3)}.s .f4{fill:var(--c4)}.s .f5{fill:var(--c5)}
.s .q1{fill:var(--q1)}.s .q2{fill:var(--q2)}.s .q3{fill:var(--q3)}.s .q4{fill:var(--q4)}
.s .ln{fill:none;stroke-width:2;stroke-linejoin:round}.s .dash{stroke-dasharray:5 3}.s .mk{stroke:var(--surface);stroke-width:2}
.s .tick{stroke:var(--c4);stroke-width:2.2;stroke-linecap:round}
</style><rect class="bg" width="920" height="350"/><text x="20" y="26" class="t" text-anchor="start">図3  駆動の無い窓の経路ごとの熱の流れ J_c / SE_c — 登録のポンプの検出器は左の破線（−3）より左の点だけを見る</text><text x="20" y="54" class="h" text-anchor="start">a  NC-dark（太陽なし）W = [15000, 20000]</text><rect class="pl" x="265.2" y="70" width="39.6" height="170"/><line class="grid" x1="153" x2="153" y1="70" y2="240"/><text x="153" y="256" class="m" text-anchor="middle">-20</text><line class="grid" x1="219" x2="219" y1="70" y2="240"/><text x="219" y="256" class="m" text-anchor="middle">-10</text><line class="grid" x1="285" x2="285" y1="70" y2="240"/><text x="285" y="256" class="m" text-anchor="middle">0</text><line class="grid" x1="351" x2="351" y1="70" y2="240"/><text x="351" y="256" class="m" text-anchor="middle">10</text><line class="grid" x1="417" x2="417" y1="70" y2="240"/><text x="417" y="256" class="m" text-anchor="middle">20</text><line class="ref" x1="265.2" x2="265.2" y1="66" y2="244"/><text x="112" y="91" text-anchor="end">親水の移動</text><g><title>1回目 親水の移動: J = -2450.6 ± 291.9 q/刻み（J/SE = -8.4、M 1個あたり -1.25）</title><circle class="f1 mk" cx="229.6" cy="82" r="5.5"/></g><g><title>2回目 親水の移動: J = 92.2 ± 182.8 q/刻み（J/SE = 0.5、M 1個あたり 2.07）</title><circle class="f2 mk" cx="288.3" cy="92" r="5.5"/></g><text x="112" y="125" text-anchor="end">中性の移動</text><g><title>1回目 中性の移動: J = -371.1 ± 297.1 q/刻み（J/SE = -1.2、M 1個あたり -0.19）</title><circle class="f1 mk" cx="276.8" cy="116" r="5.5"/></g><g><title>2回目 中性の移動: J = -238.4 ± 173.8 q/刻み（J/SE = -1.4、M 1個あたり -5.34）</title><circle class="f2 mk" cx="275.9" cy="126" r="5.5"/></g><text x="112" y="159" text-anchor="end">M の移動</text><g><title>1回目 M の移動: J = 2043.6 ± 129.5 q/刻み（J/SE = 15.8、M 1個あたり 1.04）</title><circle class="f1 mk" cx="389.1" cy="150" r="5.5"/></g><g><title>2回目 M の移動: J = 103.5 ± 25.4 q/刻み（J/SE = 4.1、M 1個あたり 2.32）</title><circle class="f2 mk" cx="311.8" cy="160" r="5.5"/></g><text x="112" y="193" text-anchor="end">回転</text><g><title>1回目 回転: J = 658.7 ± 68.0 q/刻み（J/SE = 9.7、M 1個あたり 0.33）</title><circle class="f1 mk" cx="348.9" cy="184" r="5.5"/></g><g><title>2回目 回転: J = 20.5 ± 7.0 q/刻み（J/SE = 2.9、M 1個あたり 0.46）</title><circle class="f2 mk" cx="304.5" cy="194" r="5.5"/></g><text x="112" y="227" text-anchor="end">崩壊とその逆</text><g><title>1回目 崩壊とその逆: J = -73.9 ± 308.5 q/刻み（J/SE = -0.2、M 1個あたり -0.04）</title><circle class="f1 mk" cx="283.4" cy="218" r="5.5"/></g><g><title>2回目 崩壊とその逆: J = -88.4 ± 272.1 q/刻み（J/SE = -0.3、M 1個あたり -1.98）</title><circle class="f2 mk" cx="282.9" cy="228" r="5.5"/></g><text x="285" y="274" class="m" text-anchor="middle">J / SE（W の M の数: 1回目 1967 → 2回目 45）</text><text x="450" y="54" class="h" text-anchor="start">b  A-dusk（日没の後）W = [30000, 40000]</text><rect class="pl" x="695.2" y="70" width="39.6" height="170"/><line class="grid" x1="583" x2="583" y1="70" y2="240"/><text x="583" y="256" class="m" text-anchor="middle">-20</text><line class="grid" x1="649" x2="649" y1="70" y2="240"/><text x="649" y="256" class="m" text-anchor="middle">-10</text><line class="grid" x1="715" x2="715" y1="70" y2="240"/><text x="715" y="256" class="m" text-anchor="middle">0</text><line class="grid" x1="781" x2="781" y1="70" y2="240"/><text x="781" y="256" class="m" text-anchor="middle">10</text><line class="grid" x1="847" x2="847" y1="70" y2="240"/><text x="847" y="256" class="m" text-anchor="middle">20</text><line class="ref" x1="695.2" x2="695.2" y1="66" y2="244"/><text x="542" y="91" text-anchor="end">親水の移動</text><g><title>1回目 親水の移動: J = -2095.9 ± 191.2 q/刻み（J/SE = -11.0、M 1個あたり -1.06）</title><circle class="f1 mk" cx="642.6" cy="82" r="5.5"/></g><g><title>2回目 親水の移動: J = 10.6 ± 172.5 q/刻み（J/SE = 0.1、M 1個あたり 0.23）</title><circle class="f2 mk" cx="715.4" cy="92" r="5.5"/></g><text x="542" y="125" text-anchor="end">中性の移動</text><g><title>1回目 中性の移動: J = -737.1 ± 155.5 q/刻み（J/SE = -4.7、M 1個あたり -0.37）</title><circle class="f1 mk" cx="683.7" cy="116" r="5.5"/></g><g><title>2回目 中性の移動: J = -134.4 ± 174.4 q/刻み（J/SE = -0.8、M 1個あたり -2.91）</title><circle class="f2 mk" cx="709.9" cy="126" r="5.5"/></g><text x="542" y="159" text-anchor="end">M の移動</text><g><title>1回目 M の移動: J = 2159.5 ± 103.8 q/刻み（J/SE = 20.8、M 1個あたり 1.09）</title><circle class="f1 mk" cx="852.4" cy="150" r="5.5"/></g><g><title>2回目 M の移動: J = 96.7 ± 8.4 q/刻み（J/SE = 11.5、M 1個あたり 2.10）</title><circle class="f2 mk" cx="791" cy="160" r="5.5"/></g><text x="542" y="193" text-anchor="end">回転</text><g><title>1回目 回転: J = 655.6 ± 29.8 q/刻み（J/SE = 22.0、M 1個あたり 0.33）</title><circle class="f1 mk" cx="860.3" cy="184" r="5.5"/></g><g><title>2回目 回転: J = 16.4 ± 7.6 q/刻み（J/SE = 2.1、M 1個あたり 0.35）</title><circle class="f2 mk" cx="729.2" cy="194" r="5.5"/></g><text x="542" y="227" text-anchor="end">崩壊とその逆</text><g><title>1回目 崩壊とその逆: J = 44.6 ± 308.2 q/刻み（J/SE = 0.1、M 1個あたり 0.02）</title><circle class="f1 mk" cx="716" cy="218" r="5.5"/></g><g><title>2回目 崩壊とその逆: J = -1.1 ± 189.4 q/刻み（J/SE = -0.0、M 1個あたり -0.02）</title><circle class="f2 mk" cx="715" cy="228" r="5.5"/></g><text x="715" y="274" class="m" text-anchor="middle">J / SE（W の M の数: 1回目 1981 → 2回目 46）</text><circle class="f1 mk" cx="30" cy="292" r="5.5"/><text x="40" y="296" class="m" text-anchor="start">1回目（main）</text><circle class="f2 mk" cx="140" cy="292" r="5.5"/><text x="150" y="296" class="m" text-anchor="start">2回目（rerun2）</text><rect class="pl" x="260" y="285" width="22" height="12"/><text x="288" y="296" class="m" text-anchor="start">|J/SE| &lt; 3</text><text x="20" y="320" class="m" text-anchor="start">M の移動は2回目も +4.1 SE（a）・+11.5 SE（b）で熱を出し続ける。M 1個あたりの流れは 1回目 約 1.0 → 2回目 約 2.1〜2.3 q/刻みで、循環は消えていない。</text><text x="20" y="336" class="m" text-anchor="start">運び手の M が 1/43 に減り、熱を受け取る側の経路（親水・中性の移動）の流れが雑音（SE 170〜270）に沈んだ。</text></svg>