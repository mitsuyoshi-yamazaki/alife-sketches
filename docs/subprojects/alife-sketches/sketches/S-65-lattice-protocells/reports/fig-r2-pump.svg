<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" class="s" role="img"><title>図3 駆動の無い窓の経路ごとの熱の流れ（J/SE）</title><style>
.s{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--plane:#f0efec;
--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--q1:#86b6ef;--q2:#3987e5;--q3:#1c5cab;--q4:#0d366b}
