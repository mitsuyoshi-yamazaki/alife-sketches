<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" class="f3" role="img" aria-labelledby="f3t"><title id="f3t">図3 規則の近傍と乱択の規則</title><style>
.f3{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--cell:#2b2b29;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--box:#f3f2ee}
@media (prefers-color-scheme: dark){.f3{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--cell:#e8e7e1;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--box:#232322}}
.f3 text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2);font-size:12px}
.f3 .t{fill:var(--ink);font-size:14px;font-weight:600}.f3 .h{fill:var(--ink);font-size:12.5px;font-weight:600}
.f3 .m{fill:var(--muted);font-size:11px}.f3 .bg{fill:var(--surface)}.f3 .panel{fill:var(--box)}
.f3 .grid{stroke:var(--grid);stroke-width:1}.f3 .axis{stroke:var(--axis);stroke-width:1}
.f3 .cell{fill:var(--cell)}.f3 .img{fill:none;stroke:var(--c1);stroke-width:2}.f3 .src{fill:none;stroke:var(--c2);stroke-width:2}
.f3 .vec{stroke:var(--c2);stroke-width:2;fill:none}.f3 .dot{fill:var(--c1);stroke:var(--surface);stroke-width:2}
.f3 .ring{fill:none;stroke:var(--c2);stroke-width:2}.f3 .hollow{fill:var(--surface);stroke:var(--c1);stroke-width:2}
.f3 .x{stroke:var(--muted);stroke-width:2}.f3 .ctl{stroke:var(--muted);stroke-width:2}.f3 .ref{stroke:var(--c3);stroke-width:2;stroke-dasharray:5 3}
.f3 .d3{fill:var(--c3);stroke:var(--surface);stroke-width:2}.f3 .sq{fill:var(--c2);stroke:var(--surface);stroke-width:1.5}
</style><style>.f3 .ref{stroke:var(--muted)}.f3 .l1{stroke:var(--c1);stroke-width:2;fill:none}.f3 .l2{stroke:var(--c2);stroke-width:2;fill:none}.f3 .l3{stroke:var(--c3);stroke-width:2;fill:none}.f3 .lab{fill:var(--ink2);font-size:11.5px}</style><rect class="bg" x="0" y="0" width="900" height="430"/><text x="12" y="24" class="t">図3 規則の近傍と乱択の規則では、種の軌跡がほとんど数十〜数百ステップで止まる</text><text x="12" y="44" class="m">止まる = 格子が空・周期（登録の止め方）・密（生の割合 ≥ 0.25 が 200 ステップ。本番では篩の判定が配線されておらず、S4 が数え直した）。</text><text x="12" y="59" class="m">反転した類は 140 すべてが参照の軌跡で 60 ステップまでに踏まれ、変異体はそのステップで参照から離れた（S4 の再計算で 140/140）。「写しが増える群」は事後解析。</text><line class="grid" x1="70" y1="350" x2="610" y2="350"/><text x="62" y="354" class="m" text-anchor="end">0</text><line class="grid" x1="70" y1="285" x2="610" y2="285"/><text x="62" y="289" class="m" text-anchor="end">0.25</text><line class="grid" x1="70" y1="220" x2="610" y2="220"/><text x="62" y="224" class="m" text-anchor="end">0.5</text><line class="grid" x1="70" y1="155" x2="610" y2="155"/><text x="62" y="159" class="m" text-anchor="end">0.75</text><line class="grid" x1="70" y1="90" x2="610" y2="90"/><text x="62" y="94" class="m" text-anchor="end">1</text><text x="70" y="368" class="m" text-anchor="middle">1</text><text x="221.8" y="368" class="m" text-anchor="middle">10</text><text x="373.7" y="368" class="m" text-anchor="middle">100</text><text x="525.5" y="368" class="m" text-anchor="middle">1000</text><text x="610" y="368" class="m" text-anchor="end">3600</text><line class="axis" x1="70" y1="350" x2="610" y2="350"/><text x="340" y="386" class="m" text-anchor="middle">ステップ（対数）</text><text x="20" y="76" class="m">まだ止まっていない割合</text><path class="l3" d="M70 90H390V133.3H390V176.7H390V220H390V263.3H390V306.7H390V350H610"/><path class="l2" d="M70 90H161.4V91.9H161.4V93.7H161.4V95.6H161.4V97.4H176.1V99.3H188.2V101.1H188.2V103H188.2V104.9H207.1V106.7H214.9V108.6H214.9V110.4H228.1V112.3H233.9V114.1H233.9V116H239.1V117.9H239.1V119.7H248.6V121.6H248.6V123.4H252.8V125.3