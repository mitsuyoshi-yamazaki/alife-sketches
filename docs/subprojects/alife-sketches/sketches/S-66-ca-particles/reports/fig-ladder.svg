<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 914 370" width="914" height="370" class="s" role="img" aria-labelledby="t2"><title id="t2">図2 E54 の 10 走行で、3 つの観測器が L1〜L4 のどこまで段を同定したか</title><style>
.s{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--dom:#ecebe6;--def:#9d9b95;--raw:#2b2b29;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--box:#f3f2ee;--hi:#dbe8f8}
@media (prefers-color-scheme: dark){.s{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--dom:#262625;--def:#6b6a66;--raw:#e8e7e1;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--box:#232322;--hi:#1d3350}}
.s text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2);font-size:12px}
.s .t{fill:var(--ink);font-size:14px;font-weight:600}.s .h{fill:var(--ink);font-size:12.5px;font-weight:600}
.s .m{fill:var(--muted);font-size:11px}.s .big{fill:var(--ink);font-size:20px;font-weight:600}
.s .bg{fill:var(--surface)}.s .grid{stroke:var(--grid);stroke-width:1}.s .axis{stroke:var(--axis);stroke-width:1}
.s .raw{fill:var(--raw)}.s .dom{fill:var(--dom)}.s .def{fill:var(--def)}
.s .k1{fill:var(--c1)}.s .k2{fill:var(--c2)}.s .k3{fill:var(--c3)}.s .k4{fill:var(--c4)}
.s .box{fill:var(--box);stroke:var(--axis)}.s .boxhi{fill:var(--hi);stroke:var(--axis)}.s .boxna{fill:none;stroke:var(--axis);stroke-dasharray:4 3}
.s .ln{stroke:var(--c1);stroke-width:2;fill:none}.s .thr{stroke:var(--c2);stroke-width:2;fill:none;stroke-dasharray:6 3}
.s .band{fill:var(--hi)}.s .dot{fill:var(--c1);stroke:var(--surface);stroke-width:2}.s .dot2{fill:var(--surface);stroke:var(--c2);stroke-width:2}
</style><rect class="bg" x="0" y="0" width="914" height="370"/><text x="12" y="22" class="t">図2 段の目録（E54 の 10 走行・既定の knob）——各升は、その段の登録の条件を満たした走行の数</text><text x="229" y="56" class="h" text-anchor="middle">L1 領域</text><text x="387" y="56" class="h" text-anchor="middle">L2 粒子</text><text x="545" y="56" class="h" text-anchor="middle">L3 反応（化学）</text><text x="703" y="56" class="h" text-anchor="middle">L4 二次構造</text><text x="844" y="56" class="h" text-anchor="middle">段の数 K</text><text x="12" y="98" class="h">O-lang</text><text x="12" y="116" class="m">言語を人が書き込む</text><rect class="boxhi" x="153" y="69" width="152" height="72" rx="4"><title>O-lang L1 領域: 10/10 f_dom 0.65–0.67 ① 閾値 ≥ 0.5</title></rect><text x="162" y="94" class="big">10/10</text><text x="162" y="112">f_dom 0.65–0.67</text><text x="162" y="128" class="m">① 閾値 ≥ 0.5</text><rect class="box" x="311" y="69" width="152" height="72" rx="4"><title>O-lang L2 粒子: 0/10 型は 13–14 在る 被覆 0.19–0.22（④ ≥ 0.5）</title></rect><text x="320" y="94" class="big">0/10</text><text x="320" y="112">型は 13–14 在る</text><text x="320" y="128" class="m">被覆 0.19–0.22（④ ≥ 0.5）</text><rect class="boxna" x="469" y="69" width="152" height="72" rx="4"><title>O-lang L3 反応（化学）: (0/10) 鍵 11–23・創出あり H̄ 0.35–0.68 bit（⑤ ≤ 0.1）</title></rect><text x="478" y="94" class="big">(0/10)</text><text x="478" y="112">鍵 11–23・創出あり</text><text x="478" y="128" class="m">H̄ 0.35–0.68 bit（⑤ ≤ 0.1）</text><rect class="boxna" x="627" y="69" width="152" height="72" rx="4"><title>O-lang L4 二次構造: (10/10) 36–65 個（⑨ ≥ 3） NC-frozen でも 3/3</title></rect><text x="636" y="94" class="big">(10/10)</text><text x="636" y="112">36–65 個（⑨ ≥ 3）</text><text x="636" y="128" class="m">NC-frozen でも 3/3</text><text x="844" y="108" class="h" text-anchor="middle">K = 1（10/10）</text><text x="12" y="176" class="h">O-sym</text><text x="12" y="194" class="m">素の場の対称を探す</text><rect class="box" x="153" y="147" width="152" height="72" rx="4"><title>O-sym L1 領域: 1/10 超過 e(4,0) 0.487–0.509 ② κ = 0.5（6603 だけ越えた）</title></rect><text x="162" y="172" class="big">1/10</text><text x="162" y="190">超過 e(4,0) 0.487–0.509</text><text x="162" y="206" class="m">② κ = 0.5（6603 だけ越えた）</text><rect class="boxna" x="311" y="147" width="152" height="72" rx="4"><title>O-sym L2 粒子: (0/10) 6603 だけ型 13 被覆 0.14（④ ≥ 0.5）</title></rect><text x="320" y="172" class="big">(0/10)</text><text x="320" y="190">6603 だけ型 13</text><text x="320" y="206" class="m">被覆 0.14（④ ≥ 0.5）</text><rect class="boxna" x="469" y="147" width="152" height="72" rx="4"><title>O-sym L3 反応（化学）: —  </title></rect><text x="478" y="172" class="big">—</text><text x="478" y="190"></text><text x="478" y="206" class="m"></text><rect class="boxna" x="627" y="147" width="152" height="72" rx="4"><title>O-sym L4 二次構造: —  </title></rect><text x="636" y="172" class="big">—</text><text x="636" y="190"></text><text x="636" y="206" class="m"></text><text x="844" y="186" class="h" text-anchor="middle">K = 0（9）・1（1）</text><text x="12" y="254" class="h">O-lcs</text><text x="12" y="272" class="m">局所因果状態の対称を探す</text><rect class="box" x="153" y="225" width="152" height="72" rx="4"><title>O-lcs L1 領域: 0/10 状態 91–92（純粋な領域で 8） ③ 空間の生成元なし</title></rect><text x="162" y="250" class="big">0/10</text><text x="162" y="268">状態 91–92（純粋な領域で 8）</text><text x="162" y="284" class="m">③ 空間の生成元なし</text><rect class="boxna" x="311" y="225" width="152" height="72" rx="4"><title>O-lcs L2 粒子: —  </title></rect><text x="320" y="250" class="big">—</text><text x="320" y="268"></text><text x="320" y="284" class="m"></text><rect class="boxna" x="469" y="225" width="152" height="72" rx="4"><title>O-lcs L3 反応（化学）: —  </title></rect><text x="478" y="250" class="big">—</text><text x="478" y="268"></text><text x="478" y="284" class="m"></text><rect class="boxna" x="627" y="225" width="152" height="72" rx="4"><title>O-lcs L4 二次構造: —  </title></rect><text x="636" y="250" class="big">—</text><text x="636" y="268"></text><text x="636" y="284" class="m"></text><text x="844" y="264" class="h" text-anchor="middle">K = 0（10/10）</text><text x="12" y="332" class="m">括弧つき・破線の升は、下の段が登録の条件を満たさなかったので段の数 K に入らない（その升の規則だけの陽性数）。</text><text x="12" y="350" class="m">緩い粒子（周期を問わない）に替えると O-lang は K_loose = 2（10/10）。NC-frozen の ⑨ は周期 1 の静止した塊を「複合体」と数えたもの。</text></svg>