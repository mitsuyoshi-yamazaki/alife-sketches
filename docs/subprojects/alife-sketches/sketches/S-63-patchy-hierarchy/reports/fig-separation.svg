<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" class="s" role="img" aria-labelledby="t3"><title id="t3">図3 三角形の形成温度と網目の形成温度の隔たり</title><style>
.s{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--node:#52514e}
@media (prefers-color-scheme: dark){.s{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--c1:#3987e5;--c2:#d95926;--c3:#199e70;--node:#c3c2b7}}
.s text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink2);font-size:12px}
.s .t{fill:var(--ink);font-size:14px;font-weight:600}.s .h{fill:var(--ink);font-size:12.5px;font-weight:600}
.s .m{fill:var(--muted);font-size:11px}.s .bg{fill:var(--surface)}.s .grid{stroke:var(--grid);stroke-width:1}
.s .axis{stroke:var(--axis);stroke-width:1}.s .l1{stroke:var(--c1);stroke-width:2;fill:none}
.s .l2{stroke:var(--c2);stroke-width:2;fill:none}.s .l3{stroke:var(--c3);stroke-width:2;fill:none;stroke-dasharray:5 3}
.s .d1{fill:var(--c1)}.s .d2{fill:var(--c2)}.s .d3{fill:var(--c3)}
.s .bAA{stroke:var(--c1);stroke-width:1.6}.s .bBB{stroke:var(--c2);stroke-width:1.6}.s .bAB{stroke:var(--c3);stroke-width:1.6;stroke-dasharray:2 1.5}
.s .pt{fill:var(--node)}.s .ps{fill:var(--surface);stroke:var(--node);stroke-width:1}.s .frame{fill:none;stroke:var(--axis)}
</style><rect class="bg" width="840" height="330"/><text x="16.0" y="24.0" class="t" text-anchor="start">図3　強さの比 R を上げると、三角形ができる温度と網目ができる温度が離れる</text><text x="16.0" y="44.0" class="m" text-anchor="start">各点は平滑した系列が 0.5 を初めて越えた熱浴の温度（seed 6301／交差なしは 6311）。S4 の事後解析・事前登録していない</text><circle cx="22" cy="62" r="5" class="d1"/><text x="32.0" y="66.0" class="" text-anchor="start">三角形に入った粒子が半数を越えた温度 T_tri</text><rect x="330" y="57" width="10" height="10" class="d2"/><text x="346.0" y="66.0" class="" text-anchor="start">最大の連結成分が半数を越えた温度 T_web</text><line x1="155.36233249097953" y1="86" x2="155.36233249097953" y2="276" class="grid"/><text x="155.4" y="292.0" class="m" text-anchor="middle">2</text><line x1="234.14493299639182" y1="86" x2="234.14493299639182" y2="276" class="grid"/><text x="234.1" y="292.0" class="m" text-anchor="middle">1</text><line x1="312.9275335018041" y1="86" x2="312.9275335018041" y2="276" class="grid"/><text x="312.9" y="292.0" class="m" text-anchor="middle">0.5</text><line x1="417.07246649819587" y1="86" x2="417.07246649819587" y2="276" class="grid"/><text x="417.1" y="292.0" class="m" text-anchor="middle">0.2</text><line x1="495.85506700360816" y1="86" x2="495.85506700360816" y2="276" class="grid"/><text x="495.9" y="292.0" class="m" text-anchor="middle">0.1</text><line x1="574.6376675090205" y1="86" x2="574.6376675090205" y2="276" class="grid"/><text x="574.6" y="292.0" class="m" text-anchor="middle">0.05</text><text x="365.0" y="310.0" class="m" text-anchor="middle">熱浴の温度 T（対数・右ほど低い）</text><text x="624.0" y="80.0" class="h" text-anchor="start">比 T_tri / T_web</text><text x="116.0" y="100.0" class="h" text-anchor="end">R=1</text><rect x="294.4192280593156" y="91" width="10" height="10" class="d2"><title>M-R1-1 T_web=0.563</title></rect><text x="624.0" y="100.0" class="" text-anchor="start">—（三角形は半数に届かない）</text><text x="116.0" y="138.0" class="h" text-anchor="end">R=2</text><line x1="294.61726195120843" y1="134" x2="366.275082852811" y2="134" class="axis" stroke-width="2"/><circle cx="294.61726195120843" cy="134" r="5" class="d1"><title>M-R2-1 T_tri=0.587</title></circle><rect x="361.275082852811" y="129" width="10" height="10" class="d2"><title>M-R2-1 T_web=0.313</title></rect><text x="624.0" y="138.0" class="" text-anchor="start">1.88（0.59 / 0.31）</text><text x="116.0" y="176.0" class="h" text-anchor="end">R=5</text><line x1="290.17732696899" y1="172" x2="467.7083698457668" y2="172" class="axis" stroke-width="2"/><circle cx="290.17732696899" cy="172" r="5" class="d1"><title>M-R5-1 T_tri=0.611</title></circle><rect x="462.7083698457668" y="167" width="10" height="10" class="d2"><title>M-R5-1 T_web=0.128</title></rect><text x="624.0" y="176.0" class="" text-anchor="start">4.77（0.61 / 0.13）</text><text x="116.0" y="214.0" class="h" text-anchor="end">R=10</text><line x1="293.17523211517505" y1="210" x2="577.8655309679747" y2="210" class="axis" stroke-width="2"/><circle cx="293.17523211517505" cy="210" r="5" class="d1"><title>M-R10-1 T_tri=0.595</title></circle><rect x="572.8655309679747" y="205" width="10" height="10" class="d2"><title>M-R10-1 T_web=0.049</title></rect><text x="624.0" y="214.0" class="" text-anchor="start">12.24（0.59 / 0.05）</text><text x="116.0" y="252.0" class="h" text-anchor="end">交差なし</text><line x1="295.0826024868186" y1="248" x2="306.1547151451132" y2="248" class="axis" stroke-width="2"/><circle cx="295.0826024868186" cy="248" r="5" class="d1"><title>A-R1x-1 T_tri=0.585</title></circle><rect x="301.1547151451132" y="243" width="10" height="10" class="d2"><title>A-R1x-1 T_web=0.531</title></rect><text x="624.0" y="252.0" class="" text-anchor="start">1.10（0.58 / 0.53）</text></svg>